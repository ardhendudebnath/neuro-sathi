[project]
name = "neuro-sathi-api"
version = "0.1.0"
description = "NEURO-SATHI backend: FastAPI API, sync, ML personalisation and deviation detection"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "B008",   # FastAPI's File(...)/Depends(...) defaults
  "UP042",  # str-mixin Enum kept for SQLAlchemy/pydantic value handling
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
