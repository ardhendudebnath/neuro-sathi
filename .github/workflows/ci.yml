name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements*.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - name: Validate language packs
        run: python -m app.language_packs check
      - run: pytest

  backend-postgres:
    name: Backend on PostgreSQL + RLS
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neuro_owner
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: neuro_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neuro_owner" --health-interval 5s --health-retries 20
    env:
      PGPASSWORD: ci-owner
      TEST_OWNER_DATABASE_URL: postgresql+psycopg://neuro_owner:ci-owner@localhost:5432/neuro_test
      TEST_APP_DATABASE_URL: postgresql+psycopg://app_user:ci-app@localhost:5432/neuro_test
      TEST_SERVICE_DATABASE_URL: postgresql+psycopg://neuro_service:ci-service@localhost:5432/neuro_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements*.txt}
      - run: pip install -r requirements-dev.txt
      - name: Create login roles
        run: |
          psql -h localhost -U neuro_owner -d neuro_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE app_user LOGIN PASSWORD 'ci-app' NOSUPERUSER NOBYPASSRLS" \
            -c "CREATE ROLE neuro_service LOGIN PASSWORD 'ci-service' NOSUPERUSER BYPASSRLS"
      - name: All API tests under RLS, plus direct RLS tests
        run: pytest -p no:cacheprovider

  dashboard:
    name: Caregiver dashboard
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: dashboard}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
        env: {API_BASE_URL: "https://api.example.invalid"}
      - run: npm run typecheck
      - name: Scan the browser bundle for secrets
        run: |
          if grep -rEl 'nvapi-|sk-[A-Za-z0-9]{20}|AIza[0-9A-Za-z_-]{35}|-----BEGIN|postgres(ql)?://' .next/static; then
            echo "Secret-like string found in the browser bundle"; exit 1
          fi

  mobile:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: ./tool/bootstrap.sh
      - run: flutter analyze --no-fatal-infos
      - name: SQLite for the in-memory database tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter test
      # The tester build (docs/testing-on-a-phone.md): it can be pointed at any
      # backend, shows the preview languages, and has a few tester tools.
      # Set the repository variable TEST_API_BASE_URL to bake in a staging server.
      - name: Build the tester APK
        run: >-
          flutter build apk --debug --split-per-abi
          --dart-define=TESTER_BUILD=true
          --dart-define=SHOW_PREVIEW_LANGUAGES=true
          --dart-define=API_BASE_URL=${{ vars.TEST_API_BASE_URL || 'http://10.0.2.2:8000' }}
      - name: Scan the APKs for secrets
        run: |
          for apk in build/app/outputs/flutter-apk/*.apk; do
            unzip -q -o "$apk" -d "/tmp/apk/$(basename "$apk" .apk)"
          done
          # High-signal patterns only: the bundled SQLCipher/OpenSSL and Flutter engine
          # libraries legitimately contain a bare '-----BEGIN ' PEM marker.
          if grep -rEal 'nvapi-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{32,}|-----BEGIN ([A-Z]+ )?PRIVATE KEY-----|postgres(ql)?(\+[a-z0-9]+)?://[^:@/ ]+:[^@/ ]+@' /tmp/apk; then
            echo "Secret-like string found in an APK"; exit 1
          fi
      # arm64 for most phones from the last several years, armeabi-v7a for older ones.
      - name: Publish the tester APK
        uses: actions/upload-artifact@v4
        with:
          name: neuro-sathi-tester-apk
          path: |
            mobile/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
            mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
          if-no-files-found: error
          retention-days: 14
